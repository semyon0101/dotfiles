# ==============================================================================
# Kirisimlink
# ==============================================================================

[[mappings]]
# Release binary for symlink manager
sources = ["/work/kirisimlink/target/release/kirisimlink"]
targets = ["/usr/local/bin"]

[[mappings]]
# System configuration for symlink manager
sources = ["/work/dotfiles/config/kirisimlink"]
targets = ["/etc"]

# ==============================================================================
# Hardware Integrations (ThinkPad)
# ==============================================================================

[[mappings]]
# ThinkPad mute/sound LED synchronization script
sources = ["/work/thinkpad-mute-sound-led/thinkpad-led-sync.sh"]
targets = ["/home/semyon/.local/bin/"]

[[mappings]]
# ThinkPad mute/sound LED user systemd unit
sources = ["/work/thinkpad-mute-sound-led/thinkpad-led-sync.service"]
targets = ["/home/semyon/.local/share/systemd/user"]

# ==============================================================================
# CLI Utilities & Binaries
# ==============================================================================

[[mappings]]
# General executable helper scripts
sources = ["/work/dotfiles/bin/crsl", "/work/dotfiles/bin/mihomo-sleep.sh"]
targets = ["/usr/local/bin/"]

[[mappings]]
# General executable helper scripts
sources = [
  "/work/dotfiles/bin/cam-run.sh",
  "/work/dotfiles/bin/patch_agy.py",
  "/work/dotfiles/bin/sub2yaml.py",
  # "/work/dotfiles/bin/mihomo-sleep.sh",
]
targets = ["/home/semyon/.local/bin/"]

# ==============================================================================
# Shell & Environment
# ==============================================================================

[[mappings]]
# Zsh configurations synchronized across root and user
sources = ["/work/dotfiles/config/.zshrc", "/work/dotfiles/config/.p10k.zsh"]
targets = ["/root/", "/home/semyon"]

# ==============================================================================
# Desktop & Application Configurations
# ==============================================================================

[[mappings]]
# Shared dotfiles configs for user and root
sources = [
  "/work/dotfiles/config/.editorconfig",
  "/work/dotfiles/config/niri/",
  "/work/dotfiles/config/nvim/",
  "/work/dotfiles/config/kitty",
  "/work/dotfiles/config/oh-my-posh/",
]
targets = ["/root/.config", "/home/semyon/.config/"]


# ==============================================================================
# Systemd Services
# ==============================================================================

[[mappings]]
# User session units (networking and autostart)
sources = [
  # "/work/dotfiles/systemd/user/mihomo-sleep.service",
  "/work/dotfiles/systemd/user/mihomo-party-autostart.service",
]
targets = ["/home/semyon/.local/share/systemd/user/"]

[[mappings]]
# System-wide power management and sleep hooks
sources = [
  "/work/dotfiles/systemd/system/powerprofile-wakeup.service",
  "/work/dotfiles/systemd/system/suspend-then-poweroff.service",
  "/work/dotfiles/systemd/system/mihomo-sleep.service",
]
targets = ["/usr/local/lib/systemd/system/"]

# ==============================================================================
# Link to /root/.local
# ==============================================================================

[[mappings]]
# Shared Neovim data and plugins cache
sources = ["/home/semyon/.local/share/nvim"]
targets = ["/root/.local/share"]
